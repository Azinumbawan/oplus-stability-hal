[package]
name = "oplus-project-service"
version = "3.0.0"
edition = "2021"
rust-version = "1.95"

# lib: the node adapters (host-testable core).
[lib]
name = "oplus_project_service"
path = "src/lib.rs"

# bin: the Android AIDL HAL binary. The installed service file name contains
# dots, so the build wraps the output (see ../../scripts/build_rust.sh).
[[bin]]
name = "oplus_project_service"
path = "src/bin/oplus_project_service.rs"
test = false
bench = false

[profile.release]
opt-level = 2
debug = false
strip = "symbols"
